@if (link()) {
  <ngx-extended-pdf-viewer
    height="100%"
    backgroundColor="#1f1a14"
    theme="dark"
    [src]="link()"
    [showPagingButtons]="true"
    [disableEditorButtons]="true"
    [disableTextEditor]="true"
    [disableDrawEditor]="true"
    [disableStampEditor]="true"
    [disableHighlightEditor]="true"
    [disableCommentEditor]="true"
    [disableSignatureEditor]="true"
  >
  </ngx-extended-pdf-viewer>
}
