<swiper-container
  #mainSwiper
  style="--swiper-navigation-color: #fff; --swiper-pagination-color: #fff"
  pagination="true"
  effect="coverflow"
  grab-cursor="true"
  keyboard="true"
  centered-slides="true"
  slides-per-view="auto"
  coverflow-effect-rotate="50"
  coverflow-effect-stretch="0"
  coverflow-effect-depth="100"
  coverflow-effect-modifier="1"
  coverflow-effect-slide-shadows="true"
  navigation="true"
>
  <!-- Mobile hint banner -->
  <!-- @if (showText()) {
    <div class="mobile-hint md:hidden flex items-center gap-2 justify-center py-1 px-3 text-xs text-[#c9a84c]/80 bg-[#c9a84c]/10 border-b border-[#c9a84c]/20" slot="container-start">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"/>
      </svg>
      <span>Long-press an item to view the project</span>
    </div>
  } -->

  @for (file of galleryFiles(); track file.name; let i = $index) {
    <swiper-slide class="relative group"
      (touchstart)="onTouchStart(i)"
      (touchend)="onTouchEnd()"
      (touchmove)="onTouchMove()"
    >
      <!-- Media -->
      @if (file.type === 'video' && file.link) {
        <app-video-player [url]="file.link" style="width: 100%; height: 100%"></app-video-player>
      } @else if (file.type === 'image' && file.link) {
        <img #fullScreenImg [src]="file.link" [alt]="file.name" class="w-full h-full" />
      }
    </swiper-slide>
  }
</swiper-container>
