<section id="contact" class="py-24 max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-16">
  <div>
    <h2 class="text-5xl font-['Great_Vibes'] text-[#c9a84c] mb-8">Let's Connect</h2>
    <p class="mb-8 text-[#e6dfd1]/70">
      Open for new opportunities and collaborations. Reach out to start a conversation.
    </p>
    <div class="space-y-4">
      <p>
        Email:
        <a href="mailto:admin@tselatrails.com" class="text-[#c9a84c] hover:underline">
          admin@tselatrails.com
        </a>
      </p>
      <p>
        Instagram:
        <a
          href="https://www.instagram.com/tsela_design_co/?hl=en"
          target="_blank"
          class="text-[#c9a84c] hover:underline"
          >@tsela_design_co</a
        >
      </p>
    </div>
  </div>

  <div class="bg-[#1a1814] p-8 rounded-sm mb-20">
    @if (formSubmitted()) {
      <div class="h-64 flex flex-col justify-center items-center text-center">
        <h3 class="text-2xl text-[#c9a84c] mb-4">Message Sent!</h3>
        <p>Thank you for reaching out. I'll get back to you shortly.</p>
      </div>
    } @else {
      <form [formGroup]="contactForm" (ngSubmit)="submitForm()" class="space-y-4">
        <input
          formControlName="name"
          type="text"
          placeholder="Name"
          class="w-full bg-transparent border-b border-[#c9a84c]/30 focus:border-[#c9a84c] outline-none p-2 transition-colors"
        />
        <input
          formControlName="email"
          type="email"
          placeholder="Email"
          class="w-full bg-transparent border-b border-[#c9a84c]/30 focus:border-[#c9a84c] outline-none p-2 transition-colors"
        />
        <textarea
          formControlName="message"
          placeholder="Message"
          rows="4"
          class="w-full bg-transparent border-b border-[#c9a84c]/30 focus:border-[#c9a84c] outline-none p-2 transition-colors"
        ></textarea>
        <button
          type="submit"
          [disabled]="contactForm.invalid"
          class="w-full py-3 bg-[#c9a84c] text-black font-semibold hover:bg-[#b89842] transition-colors disabled:opacity-50"
        >
          Send
        </button>
      </form>
    }
  </div>
</section>
