<div
  class="min-h-screen bg-[#0e0c09] text-[#e6dfd1] font-sans selection:bg-[#c9a84c] selection:text-black"
>
  <nav class="fixed top-0 w-full z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div
        class="text-3xl font-['Great_Vibes'] text-[#c9a84c] cursor-pointer"
        [routerLink]="['/home']"
      >
        Portfolio
      </div>

      <!-- Mobile Menu Button -->
      <button (click)="toggleMenu()" class="md:hidden text-[#c9a84c] cursor-pointer">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16m-7 6h7"
          ></path>
        </svg>
      </button>

      <!-- Desktop Nav -->
      <div class="hidden md:flex space-x-8 font-medium">
        @for (link of navLinks(); track link) {
          <a [routerLink]="['/home']" class="hover:text-[#c9a84c] transition-colors">
            <span class="flex flex-row justify-center items-center">
              <mat-icon class="mr-2"> arrow_back </mat-icon>
              {{ link }}
            </span>
          </a>
        }
      </div>
    </div>
  </nav>

  <!-- Mobile Drawer -->
  @if (isMenuOpen()) {
    <div class="fixed inset-0 z-40 bg-[#0e0c09] md:hidden pt-24 px-6 flex flex-col space-y-6">
      @for (link of navLinks(); track link) {
        <a [routerLink]="['/home']" (click)="toggleMenu()" class="text-2xl">
          <span class="flex flex-row items-center">
            <mat-icon class="mr-2"> arrow_back </mat-icon>
            {{ link }}
          </span>
        </a>
      }
    </div>
  }

  <section class="h-screen flex flex-col pt-20 px-5 relative overflow-hidden">
    <p>ID: {{ id() }}</p>
    <app-video-player></app-video-player>
  </section>
</div>
