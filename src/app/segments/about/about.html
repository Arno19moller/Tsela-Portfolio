<section id="about" class="py-24 px-6 max-w-7xl mx-auto grid lg:grid-cols-2 gap-16 items-center">
  <div class="relative">
    <div
      class="absolute -bottom-4 -right-4 w-full h-full border-2 border-[#c9a84c] rounded-[24px]"
    ></div>
    <div
      class="relative z-10 aspect-[4/5] grayscale hover:grayscale-0 rounded-[24px] transition-all duration-200 ease-in-out"
      style="
        background-image: url('about.jpg');
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
      "
    ></div>
  </div>
  <div>
    <p class="text-lg md:text-xl sub-heading max-w-2xl mb-6">About</p>
    <h2 class="text-5xl heading mb-6">Design with Intention</h2>
    @for (item of aboutBody; track item) {
      <p class="text-lg body leading-relaxed mb-6">
        {{ item }}
      </p>
    }
    <div class="grid md:grid-cols-4 grid-cols-2 gap-8 mb-8">
      <div class="flex justify-center items-center">
        <div class="text-3xl font-bold text-[#c9a84c] me-2 w-fit">2+</div>
        <div class="text-sm w-min">Years Experience</div>
      </div>
      <div class="flex justify-center items-center">
        <div class="text-3xl font-bold text-[#c9a84c] me-2 w-fit">21</div>
        <div class="text-sm w-min">Projects Delivered</div>
      </div>
      <a
        class="flex justify-center items-center cursor-pointer rounded-lg transition-all duration-300 ease-in-out border-2 border-[#0e0c09] hover:border-[#c9a84c]"
        target="_blank"
        href="https://tsela-photography.web.app/"
        rel="noopener noreferrer"
      >
        <div class="text-3xl font-bold text-[#c9a84c] me-2 w-fit">5</div>
        <div class="text-sm w-min">Shoots</div>
      </a>

      <div
        class="flex justify-center items-center cursor-pointer rounded-lg transition-all duration-300 ease-in-out border-2 border-[#0e0c09] hover:border-[#c9a84c]"
        (click)="openAwards()"
      >
        <div class="text-3xl font-bold text-[#c9a84c] me-2 w-fit">2</div>
        <div class="text-sm w-min">Industry Awards</div>
      </div>
    </div>
    <div class="flex flex-wrap gap-3">
      @for (tag of skills; track tag) {
        <span class="px-3 py-1 border border-[#c9a84c]/30 text-sm rounded-full">{{ tag }}</span>
      }
    </div>
  </div>
</section>
