<section id="about" class="py-24 px-6 max-w-7xl mx-auto grid lg:grid-cols-2 gap-16 items-center">
  <div class="relative">
    <div class="absolute -bottom-4 -right-4 w-full h-full border-2 border-[#c9a84c]"></div>
    <div
      class="relative z-10 aspect-[4/5] grayscale hover:grayscale-0 transition-all duration-200 ease-in-out"
      style="
        background-image: url('about.jpg');
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
      "
    ></div>
  </div>
  <div>
    <p class="text-lg md:text-xl sub-heading max-w-2xl mb-6">About</p>
    <h2 class="text-5xl heading mb-6">Design with Intention</h2>
    @for (item of aboutBody; track item) {
      <p class="text-lg body leading-relaxed mb-6">
        {{ item }}
      </p>
    }
    <div class="grid grid-cols-2 gap-8 mb-8">
      <div>
        <div class="text-3xl font-bold text-[#c9a84c]">2+</div>
        <div class="text-sm">Years Experience</div>
      </div>
      <div>
        <div class="text-3xl font-bold text-[#c9a84c]">21</div>
        <div class="text-sm">Projects Delivered</div>
      </div>
      <div>
        <div class="text-3xl font-bold text-[#c9a84c]">5</div>
        <div class="text-sm">Shoots</div>
      </div>
      <div>
        <div class="text-3xl font-bold text-[#c9a84c]">2</div>
        <div class="text-sm">Industry Awards</div>
      </div>
    </div>
    <div class="flex flex-wrap gap-3">
      @for (tag of skills; track tag) {
        <span class="px-3 py-1 border border-[#c9a84c]/30 text-sm rounded-full">{{ tag }}</span>
      }
    </div>
  </div>
</section>
