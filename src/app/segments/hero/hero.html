<om-particles
  [quantity]="200"
  [size]="0.6"
  [circleColor]="'#00ffcc'"
  [staticity]="70"
  [ease]="30"
  [particleSpeed]="2"
  [vx]="0.05"
  [vy]="0.05"
  styleClass="particles-background"
>
  <section
    class="content h-screen flex flex-col justify-center items-center relative overflow-hidden"
    style="
      background-image: linear-gradient(0deg, #0e0c09 5%, rgba(46, 46, 46, 0.05) 20%);
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    "
  >
    <div
      id="intro"
      class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-[#c9a84c]/10 to-transparent"
    ></div>
    <div class="relative text-center z-10 px-4">
      <!-- Graphic designer -->

      <!-- Karla Strydom -->
      <div class="flex flex-col items-center justify-end mb-6 relative">
        <p
          class="text-md md:text-xl sub-heading max-w-2xl absolute md:top-[-50px] md:left-[55px] top-[-50px]"
        >
          Graphic Designer & Visual Storyteller
        </p>
        <h1 class="text-7xl md:text-9xl heading mb-0">Karla Strydom</h1>
        <p
          class="sub-heading max-w-2xl absolute bottom-[-10px] left-[35px] md:left-[10px] text-xl md:text-2xl hollow-text"
        >
          Where design meets meaning
        </p>
      </div>

      <!-- Crafting -->
      <p class="text-lg md:text-xl body max-w-2xl mx-auto">
        Crafting identities, editorial worlds and visual languages that endure.
      </p>
      <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center">
        <a href="/home#projects">
          <button
            class="px-8 py-3 border border-[#c9a84c] bg-[#c9a84c] text-black hover:bg-transparent hover:text-[#c9a84c] transition-colors cursor-pointer rounded-md"
          >
            View Projects
          </button>
        </a>
        <a href="/home#contact">
          <button
            class="px-8 py-3 border border-[#c9a84c] text-[#c9a84c] hover:bg-[#c9a84c] hover:text-black transition-colors cursor-pointer rounded-md"
          >
            Contact Me
          </button>
        </a>
      </div>
    </div>
  </section>
</om-particles>
